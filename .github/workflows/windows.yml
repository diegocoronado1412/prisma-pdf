name: Instalador Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywin32 pyinstaller

      - name: Datos de OCR (español e inglés, máxima precisión)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tessdata | Out-Null
          foreach ($l in 'spa','eng','osd') {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata" -OutFile "tessdata/$l.traineddata"
          }

      - name: Pruebas
        run: python tests/test_core.py

      - name: Empaquetar
        run: >
          pyinstaller --noconfirm --windowed --name PrismaPDF --icon assets/icono.ico
          --add-data "tessdata;tessdata" --add-data "assets;assets"
          --collect-all pdf2docx --collect-data pptx --collect-data docx
          --hidden-import win32com.client --hidden-import pythoncom
          PrismaPDF.py

      - name: Probar que el .exe arranca
        shell: pwsh
        run: |
          $p = Start-Process dist\PrismaPDF\PrismaPDF.exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "El programa se cerró al abrir (código $($p.ExitCode))" }
          Stop-Process $p

      - name: Instalador
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PrismaPDF-Instalador-Windows
          path: Output/PrismaPDF-Setup.exe
